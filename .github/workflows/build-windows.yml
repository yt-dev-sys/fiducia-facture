name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build PyInstaller application and Inno Setup installer
        shell: pwsh
        run: python scripts/build_release.py

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FiduciaFacture-Windows-${{ github.ref_name }}
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/installer/*.exe
            dist/installer/*.sha256
